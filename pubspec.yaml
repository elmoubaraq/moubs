name: evergreen
description: "Evergreen - PDF Scanner & Converter Super App"
publish_to: 'none'
version: 2.1.0+5

environment:
  sdk: ^3.11.1

dependencies:
  cunning_document_scanner: ^3.0.3
  file_picker: ^11.0.3
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_riverpod: ^3.3.2
  go_router: ^17.5.0
  google_fonts: ^8.2.1
  google_mlkit_text_recognition: ^0.16.0
  google_mobile_ads: ^9.1.0
  hive_flutter: ^1.1.0
  image: ^4.10.1
  image_picker: ^1.2.3
  open_file: ^4.0.0
  path_provider: ^2.1.6
  pdf: ^3.12.0
  pdf_combiner: ^6.2.2
  pdf_manipulator: ^5.0.0
  printing: ^5.14.3
  share_plus: ^12.0.2
  shimmer: ^3.0.0
  syncfusion_flutter_pdf: ^33.2.13
  syncfusion_flutter_pdfviewer: ^33.2.13
  syncfusion_flutter_signaturepad: ^33.2.15
  url_launcher: ^6.3.2
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "assets/evergreen-adaptive-background-432.png"
  adaptive_icon_foreground: "assets/evergreen-adaptive-foreground-432.png"
  min_sdk_android: 24

flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#121212"
  image: "assets/icon.png"
  android: true
  ios: false

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
