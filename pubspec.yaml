name: evergreen
description: "Evergreen - PDF Scanner & Converter Super App"
publish_to: 'none'
version: 2.0.0+3

environment:
  sdk: ^3.11.1

dependencies:
  cached_network_image: ^3.4.1
  camera: ^0.12.0+1
  cunning_document_scanner: ^1.4.0
  file_picker: ^8.3.2
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_riverpod: ^3.3.1
  flutter_svg: ^2.2.4
  go_router: ^17.2.1
  google_fonts: ^8.0.2
  google_mlkit_text_recognition: ^0.15.1
  google_mobile_ads: ^8.0.0
  hive_flutter: ^1.1.0
  image: ^4.8.0
  image_picker: ^1.2.1
  intl: ^0.20.2
  lottie: ^3.3.3
  open_file: ^3.5.11
  path_provider: ^2.1.5
  pdf: ^3.12.0
  pdf_combiner: ^6.0.4
  pdf_manipulator: ^0.5.0
  permission_handler: ^12.0.1
  printing: ^5.14.3
  riverpod_annotation: ^4.0.2
  share_plus: ^12.0.2
  shared_preferences: ^2.5.5
  shimmer: ^3.0.0
  syncfusion_flutter_pdfviewer: ^33.2.3
  syncfusion_flutter_signaturepad: ^33.2.3
  url_launcher: ^6.3.1
  uuid: ^4.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icon.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#121212"
  image: "assets/icon.png"
  android: true
  ios: false

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
